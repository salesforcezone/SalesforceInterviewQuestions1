<html lang="en">
<head>

    <title>Salesforce Interview Questions</title>

        /* ───────────── reset & base ───────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;

            align-items: center;
            padding: 20px;
        }

            width: 100%;
            max-width: 1200px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 28px 30px 36px;
            transition: all 0.2s;
        }

        /* ───────────── header ───────────── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-left .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0a2540;
            letter-spacing: -0.3px;
        }

        .header-left .badge {
            font-size: 0.75rem;
            font-weight: 600;
            background: #dbeafe;
            color: #1a56db;
            padding: 4px 14px;
            border-radius: 40px;
        }

        .progress {
            font-size: 0.9rem;
            font-weight: 500;
            color: #4b5563;
            background: #f1f5f9;
            padding: 4px 18px;
            border-radius: 40px;
            white-space: nowrap;
        }

        /* ───────────── company pills (wrapped) ───────────── */
        .company-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 8px 0 16px 0;
            margin-bottom: 12px;
        }

        .company-pill {
            flex: 0 0 auto;
            padding: 8px 18px;
            border-radius: 40px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .company-pill:hover {
            background: #eef2f6;
            border-color: #94a3b8;
        }

        .company-pill.active {
            background: #0a2540;
            border-color: #0a2540;
            color: white;
            box-shadow: 0 2px 8px rgba(10, 37, 64, 0.2);
        }

        /* ───────────── navigation arrows ───────────── */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: #ffffff;
            border: 1.5px solid #d1d9e6;
            border-radius: 60px;
            padding: 8px 24px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .nav-btn:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #94a3b8;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
        }

        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        .nav-btn.primary {
            background: #0a2540;
            border-color: #0a2540;
            color: white;
        }

        .nav-btn.primary:hover:not(:disabled) {
            background: #1a3a5a;
            border-color: #1a3a5a;
        }

        .nav-info {
            font-size: 0.9rem;
            font-weight: 500;
            color: #4b5563;
        }

        /* ───────────── candidate cards ───────────── */
        .candidates-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-height: 560px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .candidates-grid::-webkit-scrollbar {
            width: 6px;
        }
        .candidates-grid::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .candidates-grid::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .candidate-card {
            background: #f9fbfd;
            border-radius: 18px;
            border: 1px solid #e9edf3;
            padding: 20px 24px 24px;
            transition: all 0.15s;
        }

        .candidate-card:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
        }

        .candidate-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .candidate-title .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #0a2540;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .candidate-title h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #0a2540;
            letter-spacing: -0.2px;
        }

        .candidate-title .round-tag {
            font-size: 0.7rem;
            font-weight: 600;
            background: #e2e8f0;
            color: #334155;
            padding: 2px 12px;
            border-radius: 40px;
            margin-left: auto;
            white-space: nowrap;
        }

        .question-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .question-list li {
            font-size: 0.92rem;
            line-height: 1.6;
            color: #1e293b;
            padding: 6px 12px 6px 28px;
            position: relative;
            border-radius: 8px;
            transition: background 0.1s;
        }

        .question-list li::before {
            content: "▹";
            position: absolute;
            left: 6px;
            color: #0a2540;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .question-list li:hover {
            background: #f1f5f9;
        }

        /* ───────────── responsive ───────────── */
        @media (max-width: 700px) {
            .app-container {
                padding: 16px 14px 24px;
                border-radius: 20px;
            }
            .header-left .brand {
                font-size: 1.2rem;
            }
            .company-pill {
                font-size: 0.75rem;
                padding: 6px 14px;
            }
            .nav-bar {
                flex-wrap: wrap;
                justify-content: center;
            }
            .nav-btn {
                padding: 6px 16px;
                font-size: 0.8rem;
            }
            .candidate-card {
                padding: 14px 16px 18px;
            }
            .question-list li {
                font-size: 0.82rem;
                padding: 4px 8px 4px 24px;
            }
        }

        @media (max-width: 450px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .candidate-title h3 {
                font-size: 0.95rem;
            }
            .candidate-title .round-tag {
                font-size: 0.6rem;
                padding: 1px 10px;
            }
        }

        .fade-in {
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    //  RENDER LOGIC
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    let currentIndex = 0;

    const companyStrip = document.getElementById('companyStrip');
    const candidatesContainer = document.getElementById('candidatesContainer');
    const companyBadge = document.getElementById('companyBadge');
    const progressText = document.getElementById('progressText');
    const currentNum = document.getElementById('currentNum');
    const totalNum = document.getElementById('totalNum');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function renderCompanyList() {
        companyStrip.innerHTML = companyData.map((comp, idx) =>
            `<button class="company-pill ${idx === currentIndex ? 'active' : ''}" data-index="${idx}">${comp.name}</button>`
        ).join('');

        // Attach click events
        companyStrip.querySelectorAll('.company-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                const idx = parseInt(btn.dataset.index, 10);
                if (idx !== currentIndex) {
                    currentIndex = idx;
                    renderAll();
                }
            });
        });
    }

    function renderCandidates() {
        const data = companyData[currentIndex];
        if (!data) return;

        // update badge & progress
        const totalQ = data.candidates.reduce((sum, c) => sum + c.questions.length, 0);
        companyBadge.textContent = data.name;
        progressText.textContent = `${currentIndex + 1} / ${companyData.length}`;
        currentNum.textContent = currentIndex + 1;
        totalNum.textContent = companyData.length;

        // candidates
        candidatesContainer.innerHTML = data.candidates.map((cand, ci) => `
            <div class="candidate-card fade-in">
                <div class="candidate-title">
                    <div class="avatar">${cand.label.replace('Candidate ', 'C')}</div>
                    <h3>${cand.label}</h3>
                    <span class="round-tag">${cand.round || 'Round'}</span>
                </div>
                <ul class="question-list">
                    ${cand.questions.map(q => `<li>${q}</li>`).join('')}
                </ul>
            </div>
        `).join('');

        // update buttons
        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === companyData.length - 1;

        // scroll to top
        candidatesContainer.scrollTop = 0;

        // highlight active pill
        companyStrip.querySelectorAll('.company-pill').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === currentIndex);
        });
    }

    function renderAll() {
        renderCompanyList();
        renderCandidates();
    }

    // ───────────── navigation events ─────────────
    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderAll();
        }
    });

    nextBtn.addEventListener('click', () => {
        if (currentIndex < companyData.length - 1) {
            currentIndex++;
            renderAll();
        }
    });

    // ───────────── keyboard support ─────────────
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault();
            if (currentIndex < companyData.length - 1) {
                currentIndex++;
                renderAll();
            }
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            if (currentIndex > 0) {
                currentIndex--;
                renderAll();
            }
        }
    });

    // ───────────── initial render ─────────────
    renderAll();
</script>
